services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASS}
      DOCKER_INFLUXDB_INIT_ORG: homebrew
      DOCKER_INFLUXDB_INIT_BUCKET: fermentation
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
    networks:
      - brewery-net

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=homebrew
      - INFLUX_BUCKET=fermentation
      - INFLUX_URL=http://influxdb:8086
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brewery-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - brewery-net
    depends_on:
      - influxdb

  brew-brain:
    build: ./app
    container_name: brew-brain
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=homebrew
      - INFLUX_BUCKET=fermentation
      - TZ=Europe/London
      - BREW_BRAIN_DATA=/data
      - BREW_BRAIN_API_TOKEN=${BREW_BRAIN_API_TOKEN:-secure_default_token}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./brain_data:/data
    networks:
      - brewery-net
    depends_on:
      - influxdb
      - redis

  web:
    image: ghcr.io/kenokelly/brew-brain-web:latest
    container_name: brew-brain-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - API_HOST=brew-brain
      - BREW_BRAIN_API_TOKEN=${BREW_BRAIN_API_TOKEN:-secure_default_token}
    networks:
      - brewery-net
    depends_on:
      - brew-brain

  celery-worker:
    build: ./app
    container_name: celery-worker
    command: celery -A app.extensions.celery worker --loglevel=info
    working_dir: /app
    restart: unless-stopped
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=homebrew
      - INFLUX_BUCKET=fermentation
      - REDIS_URL=redis://redis:6379/0
      - BREW_BRAIN_DATA=/data
      - PYTHONPATH=/
    volumes:
      - ./brain_data:/data
    networks:
      - brewery-net
    depends_on:
      - redis
      - influxdb

  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - brewery-net


networks:
  brewery-net:
    driver: bridge
