name: Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      # Advisory only for now: this codebase has never been linted/type-checked
      # in CI before (these steps referenced a nonexistent brew-brain/ subdirectory
      # and silently never ran), so there's a real pre-existing backlog (682 ruff
      # findings, 22 mypy errors as of 2026-09-16) that needs its own dedicated
      # cleanup pass before these can be hard gates without blocking unrelated work.
      - name: Run Ruff (advisory)
        continue-on-error: true
        run: ruff check app

      - name: Run MyPy (advisory)
        continue-on-error: true
        run: mypy app --ignore-missing-imports

      - name: Run Pytest
        env:
          INFLUX_TOKEN: dummy
        run: pytest tests
