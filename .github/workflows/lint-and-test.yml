name: Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f brew-brain/app/requirements.txt ]; then pip install -r brew-brain/app/requirements.txt; fi

      - name: Run Ruff
        run: ruff check brew-brain/app

      - name: Run MyPy
        run: mypy brew-brain/app --ignore-missing-imports

      - name: Run Pytest
        env:
          INFLUX_TOKEN: dummy
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/brew-brain/app
          pytest brew-brain/tests --ignore=brew-brain/tests/test_ui_improvements.py
